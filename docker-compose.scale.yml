# Dùng cùng docker-compose.yml để chạy nhiều agent sau một cổng Nginx.
# docker compose -f docker-compose.yml -f docker-compose.scale.yml up -d --scale agent=3
services:
  agent:
    ports: !reset []

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      agent:
        condition: service_healthy
